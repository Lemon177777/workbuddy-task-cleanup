<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="100%" role="img" aria-label="WorkBuddy 任务垃圾清理 · WorkBuddy Task Junk Cleanup">
  <title>WorkBuddy 任务垃圾清理</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="55%" stop-color="#111a30"/>
      <stop offset="100%" stop-color="#0b1224"/>
    </linearGradient>
    <radialGradient id="glow1" cx="82%" cy="16%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="6%" cy="98%" r="64%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="chipA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="chipB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" opacity="0.055"/>
    </pattern>
    <filter id="blurBig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blurSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>
  <rect width="1280" height="380" fill="url(#dots)"/>
  <rect width="1280" height="380" fill="url(#glow1)"/>
  <rect width="1280" height="380" fill="url(#glow2)"/>
  <path d="M0 356 L1280 296 L1280 380 L0 380 Z" fill="#60a5fa" opacity="0.055"/>

  <g font-family="ui-sans-serif,-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif">

    <!-- eyebrow -->
    <rect x="72" y="52" width="272" height="34" rx="17" fill="#ffffff" opacity="0.07"/>
    <rect x="72.5" y="52.5" width="271" height="33" rx="16.5" fill="none" stroke="#93c5fd" stroke-opacity="0.35"/>
    <circle cx="94" cy="69" r="4" fill="#4ade80"/>
    <text x="108" y="74" font-size="15" fill="#bfdbfe" letter-spacing="0.7">WorkBuddy Skill · 磁盘维护</text>

    <!-- title -->
    <text x="72" y="180" font-size="60" font-weight="700" fill="#ffffff" letter-spacing="0.5">WorkBuddy 任务垃圾清理</text>
    <text x="74" y="222" font-size="20" fill="#8fa6c9" letter-spacing="0.3">Reclaim disk space left behind by deleted sessions</text>
    <rect x="74" y="248" width="132" height="4" rx="2" fill="url(#accent)"/>

    <!-- pills -->
    <g font-size="15" fill="#cfe0ff">
      <rect x="72" y="288" width="158" height="34" rx="17" fill="#ffffff" opacity="0.07"/>
      <text x="151" y="311" text-anchor="middle">Python 3 · 零依赖</text>

      <rect x="242" y="288" width="146" height="34" rx="17" fill="#ffffff" opacity="0.07"/>
      <text x="315" y="311" text-anchor="middle">只读扫描优先</text>

      <rect x="400" y="288" width="118" height="34" rx="17" fill="#ffffff" opacity="0.07"/>
      <text x="459" y="311" text-anchor="middle">四级分级</text>

      <rect x="530" y="288" width="146" height="34" rx="17" fill="#ffffff" opacity="0.07"/>
      <text x="603" y="311" text-anchor="middle">确认后才动手</text>
    </g>
  </g>

  <!-- right: data matrix, some cells marked for cleanup -->
  <g>
    <circle cx="1013" cy="196" r="120" fill="#3b82f6" opacity="0.20" filter="url(#blurBig)"/>

    <!-- dim cells (kept) -->
    <g fill="#ffffff" opacity="0.07">
      <rect x="880" y="120" width="56" height="56" rx="12"/>
      <rect x="1090" y="120" width="56" height="56" rx="12"/>
      <rect x="950" y="190" width="56" height="56" rx="12"/>
      <rect x="1020" y="260" width="56" height="56" rx="12"/>
      <rect x="1090" y="190" width="56" height="56" rx="12"/>
      <rect x="880" y="260" width="56" height="56" rx="12"/>
    </g>

    <!-- marked cells -->
    <g>
      <rect x="950" y="120" width="56" height="56" rx="12" fill="url(#chipA)"/>
      <rect x="1020" y="120" width="56" height="56" rx="12" fill="url(#chipB)"/>
      <rect x="880" y="190" width="56" height="56" rx="12" fill="url(#chipB)"/>
      <rect x="1020" y="190" width="56" height="56" rx="12" fill="url(#chipA)"/>
      <rect x="950" y="260" width="56" height="56" rx="12" fill="url(#chipA)"/>
      <rect x="1090" y="260" width="56" height="56" rx="12" fill="url(#chipB)"/>
    </g>

    <!-- sparkle on a marked cell -->
    <g stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.85">
      <path d="M978 134 v28 M964 148 h28"/>
      <path d="M1048 274 v20 M1038 284 h20"/>
    </g>

    <!-- scan sweep -->
    <rect x="862" y="252" width="300" height="3" rx="1.5" fill="#a78bfa" opacity="0.9" filter="url(#blurSm)"/>
    <text x="1013" y="336" text-anchor="middle" font-size="15" fill="#8fa6c9"
          font-family="ui-sans-serif,-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
      80 个已删会话 · 3.0 GB 可回收
    </text>
  </g>
</svg>
