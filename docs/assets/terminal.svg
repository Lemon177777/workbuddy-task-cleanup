<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 716" width="100%" role="img" aria-label="终端演示：wb_scan.py 只读盘点输出示例（v1.1）">
  <title>终端演示 · v1.1</title>
  <defs>
    <linearGradient id="winbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c30"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="716" rx="14" fill="url(#winbg)"/>
  <rect x="0.5" y="0.5" width="1279" height="715" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- title bar -->
  <rect x="0" y="0" width="1280" height="46" rx="14" fill="#ffffff" opacity="0.045"/>
  <rect x="0" y="32" width="1280" height="14" fill="#ffffff" opacity="0.045"/>
  <circle cx="30" cy="23" r="7" fill="#ff5f57"/>
  <circle cx="54" cy="23" r="7" fill="#febc2e"/>
  <circle cx="78" cy="23" r="7" fill="#28c840"/>
  <text x="640" y="29" text-anchor="middle" font-size="14" fill="#9db0cf"
        font-family="ui-sans-serif,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
    Terminal — wb_scan.py（只读，不修改任何文件）
  </text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15">

    <!-- 1. command -->
    <text x="34" y="82" fill="#4ade80">$</text>
    <text x="52" y="82" fill="#e6edf7">python scripts/wb_scan.py --json ~/wb_cleanup_report.json</text>
    <rect x="562" y="71" width="9" height="15" fill="#e6edf7" opacity="0.55"/>

    <!-- 2. rule -->
    <text x="34" y="112" fill="#4a5c78">====================================================================================================</text>

    <!-- 3. header -->
    <text x="34" y="136" fill="#e6edf7">WorkBuddy 已删任务残留盘点</text>
    <text x="382" y="136" fill="#8fa6c9">root=/home/me/.workbuddy</text>

    <!-- 4. counts -->
    <text x="34" y="160" fill="#c3d2e8">会话总数</text>
    <text x="118" y="160" fill="#ffffff" font-weight="700">412</text>
    <text x="152" y="160" fill="#4a5c78">|</text>
    <text x="174" y="160" fill="#c3d2e8">已删除</text>
    <text x="246" y="160" fill="#fb7185" font-weight="700">80</text>
    <text x="280" y="160" fill="#4a5c78">|</text>
    <text x="302" y="160" fill="#c3d2e8">存活</text>
    <text x="356" y="160" fill="#4ade80" font-weight="700">332</text>

    <!-- 5. rule -->
    <text x="34" y="184" fill="#4a5c78">====================================================================================================</text>

    <!-- 6. automations -->
    <text x="34" y="216" fill="#5eead4" font-weight="700">[自动化]</text>
    <text x="134" y="216" fill="#c3d2e8">共 7 条任务，保护 3 个工作目录</text>

    <!-- 7. tier A -->
    <text x="34" y="250" fill="#93c5fd" font-weight="700">[A] 按已删会话 id 命名的缓存（纯内部数据，可直接清理）</text>

    <!-- 8-12. rows -->
    <text x="76"  y="274" fill="#c3d2e8">tasks</text>
    <text x="260" y="274" fill="#5d7395">孤儿</text>
    <text x="430" y="274" fill="#c3d2e8" text-anchor="end">18 个</text>
    <text x="580" y="274" fill="#c3d2e8" text-anchor="end">412.0KB</text>

    <text x="76"  y="298" fill="#c3d2e8">artifact-index</text>
    <text x="260" y="298" fill="#5d7395">孤儿</text>
    <text x="430" y="298" fill="#c3d2e8" text-anchor="end">80 个</text>
    <text x="580" y="298" fill="#c3d2e8" text-anchor="end">96.0KB</text>

    <text x="76"  y="322" fill="#c3d2e8">changes-detail</text>
    <text x="260" y="322" fill="#5d7395">孤儿</text>
    <text x="430" y="322" fill="#c3d2e8" text-anchor="end">61 个</text>
    <text x="580" y="322" fill="#c3d2e8" text-anchor="end">84.2MB</text>

    <text x="76"  y="346" fill="#c3d2e8">file-history</text>
    <text x="260" y="346" fill="#5d7395">孤儿</text>
    <text x="430" y="346" fill="#c3d2e8" text-anchor="end">44 个</text>
    <text x="580" y="346" fill="#c3d2e8" text-anchor="end">41.6MB</text>

    <text x="76"  y="370" fill="#c3d2e8">projects</text>
    <text x="260" y="370" fill="#5d7395">孤儿</text>
    <text x="430" y="370" fill="#c3d2e8" text-anchor="end">77 个</text>
    <text x="580" y="370" fill="#c3d2e8" text-anchor="end">2.1MB</text>

    <text x="76"  y="394" fill="#8fa6c9">小计</text>
    <text x="580" y="394" fill="#8fa6c9" text-anchor="end">128.4MB</text>

    <!-- 14. tier B1 -->
    <text x="34"  y="426" fill="#5eead4" font-weight="700">[B1] 真·空壳孤儿工作区（无文件、无记忆）</text>
    <text x="430" y="426" fill="#c3d2e8" text-anchor="end">36 个</text>
    <text x="580" y="426" fill="#c3d2e8" text-anchor="end">16.0KB</text>

    <!-- 15. tier B2 -->
    <text x="34"  y="456" fill="#fb7185" font-weight="700">[B2] 含用户文件/工作区记忆的孤儿工作区</text>
    <text x="440" y="456" fill="#c3d2e8" text-anchor="end">18 个</text>
    <text x="560" y="456" fill="#ffd9e0" text-anchor="end">146.5MB</text>
    <text x="590" y="456" fill="#fb7185">[须逐个确认]</text>

    <!-- 16-18. B2 detail -->
    <text x="76"  y="480" fill="#c3d2e8">### 2026-09-14-10-22-31</text>
    <text x="430" y="480" fill="#93a8c9" text-anchor="end">[62.7MB]</text>
    <text x="470" y="480" fill="#fda4af">用户文件+记忆</text>

    <text x="112" y="504" fill="#7b8dad">58.1MB</text>
    <text x="212" y="504" fill="#c3d2e8">光缆台账（延庆段）.xlsx</text>

    <text x="112" y="528" fill="#c084fc">[记忆]</text>
    <text x="212" y="528" fill="#c3d2e8">.workbuddy/memory/2026-09-14.md</text>

    <!-- 19-20. protected -->
    <text x="34"  y="560" fill="#4ade80" font-weight="700">[受保护] 绝不删除的孤儿工作区</text>
    <text x="320" y="560" fill="#86efac">3 个</text>

    <text x="76"  y="584" fill="#c3d2e8">2026-10-03-18-10-05</text>
    <text x="430" y="584" fill="#4ade80">[被自动化任务引用：每日台账汇总]</text>

    <!-- 21. tier C -->
    <text x="34"  y="616" fill="#fbbf24" font-weight="700">[C] 诊断日志 / 追踪</text>
    <text x="580" y="616" fill="#ffe9bd" text-anchor="end">合计 2.75GB</text>

    <text x="76"  y="640" fill="#c3d2e8">traces/</text>
    <text x="260" y="640" fill="#8fa6c9">14 项</text>
    <text x="580" y="640" fill="#c3d2e8" text-anchor="end">1.92GB</text>

    <text x="76"  y="664" fill="#c3d2e8">logs/sandbox/</text>
    <text x="260" y="664" fill="#8fa6c9">12 天</text>
    <text x="580" y="664" fill="#c3d2e8" text-anchor="end">634.0MB</text>

    <!-- 24. verify -->
    <text x="34"  y="694" fill="#4ade80" font-weight="700">[OK] 存活会话 332 个，工作区缺失 0 个</text>
  </g>
</svg>
